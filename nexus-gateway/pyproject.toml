[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-gateway"
version = "0.1.0"
description = "Loopback-only OpenAI-compatible inference and Diffusers gateway for Nexus Harness"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.7.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]
runtime = [
  "accelerate>=1.0.0",
  "diffusers>=0.32.0",
  "Pillow>=10.0.0",
  "torch>=2.4.0",
  "transformers>=4.49.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
