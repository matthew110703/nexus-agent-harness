# Nexus Harness v2.3.0 Colab overlay (Single-Model Lock & Focused Local-GPU Preset):
#   dsh web --patch apps/cli/config/examples/colab.overlay.yml \
#     --public-url https://<tunnel>.trycloudflare.com \
#     --trusted-host <tunnel>.trycloudflare.com \
#     --no-open
#
# Architecture & security defaults:
# - Loopback-only Nexus gateway (http://127.0.0.1:7861/v1) with Host-only NEXUS_API_KEY
# - Single Colab-selected language model locked in llm-pi-ai and agent-default-model
# - External DeepSeek routes, cloud web providers, and Models settings page disabled
# - Focused single-GPU standard preset (disables subagent/job/team/ask_user confusion on local LLMs)
# - Pins session workspace root to persistent Google Drive default-workspace
# - Native Nexus Host plugin (intent-guarded image generation + workspace fs/observed sync)
# - Reactive Nexus Runtime UI status badge, turn-tail showcase gallery & modal lightbox

- id: authentication-token
  config:
    trustForwardedProto: true

- id: working-directory
  config:
    defaultDirectory: !!js process.env.NEXUS_DEFAULT_WORKSPACE || process.cwd()

- id: sandbox-policy
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.env.NEXUS_DEFAULT_WORKSPACE || process.cwd()

- id: bash-sandbox
  disabled: !!js process.platform === 'win32'
  config:
    timeoutMs: 180000

- id: approval
  config:
    policy: !!js "(process.env.DSH_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

- id: fs-sandbox
  config:
    cwd: !!js process.env.NEXUS_DEFAULT_WORKSPACE || process.cwd()

- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: first-search

- id: session-title-llm
  disabled: true

- id: agent-team
  disabled: true

- id: tool-agent-team
  disabled: true

- id: web
  config:
    searchProvider: nexus-search
    fetchProvider: http

- id: web-search-deepseek
  disabled: true

- id: web-deepseek-api
  disabled: true

- id: directory-picker
  disabled: true

- id: agent-default-model
  config:
    provider: nexus
    model: !!js process.env.NEXUS_SELECTED_LANGUAGE_MODEL || ''

- id: llm-deepseek
  disabled: true

- id: llm-deepseek-account
  disabled: true

- id: ui-settings-models
  disabled: true

- id: llm-pi-ai
  config:
    providers:
      nexus:
        displayName: Nexus Local Gateway
        api: openai-completions
        baseURL: !!js process.env.NEXUS_GATEWAY_URL || 'http://127.0.0.1:7861/v1'
        apiKeyEnv: NEXUS_API_KEY
        defaultInput:
          - text
        defaultContextWindow: 32768
        defaultMaxTokens: 4096
        models: !!js JSON.parse(process.env.NEXUS_DISCOVERED_MODELS || '[]')
        compat:
          supportsDeveloperRole: false
          supportsStore: false
          supportsStrictMode: false
          supportsUsageInStreaming: true
          requiresToolResultName: true
          maxTokensField: max_tokens

- id: nexus-runtime-ui
  disabled: false

- id: ui-workspace
  config:
    recentViewLimit: 10
    showArchiveMenu: false

- id: preset-standard
  config:
    id: standard
    order: 1
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: >-
            You are a helpful coding, research, and multimodal assistant powered by the {{model}} model in Nexus AI Lab.
            Answer conversational questions, greetings, and capability inquiries directly in clear prose without calling tools.
            Use tools only when inspecting or editing workspace files, executing shell commands, searching the web, or generating an explicitly requested image.
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      - id: time-context
        name: '@deepseek-ai/dsh-time-context'
      - id: tool-bash
        name: '@deepseek-ai/dsh-tool-bash'
        disabled: !!js process.platform === 'win32'
        config:
          enableRunInBackground: !!js process.env.NEXUS_ENABLE_BG_JOBS === '1'
          promoteOnTimeout: !!js process.env.NEXUS_ENABLE_BG_JOBS === '1'
      - id: tool-pwsh
        name: '@deepseek-ai/dsh-tool-pwsh'
        disabled: !!js process.platform !== 'win32'
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
        config:
          applyPatch: false
          readImage: !!js process.env.NEXUS_VISION_INPUT_ENABLED === '1'
      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'
        disabled: !!js process.env.NEXUS_ENABLE_BG_JOBS !== '1'
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
        config:
          customSkillDirs:
            - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
        disabled: !!js process.env.NEXUS_ENABLE_SKILLS !== '1'
      - id: planning
        name: cordis:group
        group: true
        isolate:
          planMode: true
        config:
          - id: plan-mode
            name: '@deepseek-ai/dsh-plan-mode'
            config:
              section: |
                You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode.
                Explore first with read-only file and search tools. Do not edit or write files while in plan mode.
                When ready, call exit_plan_mode with the complete plan markdown starting with a # title as the final tool call of your turn.
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
        disabled: !!js process.env.NEXUS_ENABLE_ASK_USER !== '1'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: '@deepseek-ai/dsh-tool-web'
        config:
          fetch: true
          searchTimeoutMs: 60000
      - id: present
        name: '@deepseek-ai/dsh-tool-present'

- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
      config:
        maxEntries: 1000
        allowedRoots:
          - !!js process.env.NEXUS_WORKSPACE_ROOT || '/content/drive/MyDrive/Nexus/workspaces/projects'
          - !!js process.env.NEXUS_SHARED_WORKSPACE_ROOT || '/content/drive/MyDrive/Nexus/workspaces/shared'
          - !!js process.env.NEXUS_OUTPUTS_ROOT || '/content/drive/MyDrive/Nexus/outputs'
    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
    - id: nexus-host
      name: '@deepseek-ai/dsh-nexus-host'
      config:
        gatewayUrl: !!js process.env.NEXUS_GATEWAY_ROOT_URL || 'http://127.0.0.1:7861'
        apiKeyEnv: NEXUS_API_KEY
        imageTimeoutMs: 900000
        progressTimeoutMs: 5000
    - id: plugin-market
      name: '@deepseek-ai/dsh-plugin-market'
      disabled: !!js "!ctx.get('profileContext')"
      config:
        indexes:
          - !!js process.env.NEXUS_PLUGIN_INDEX_URL || 'http://127.0.0.1:7861/v1/plugin-index.json'
    - id: ui-plugin-market
      name: '@deepseek-ai/dsh-client-ui-plugin-market'
