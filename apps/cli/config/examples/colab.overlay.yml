# Nexus Harness 1.0.0 Colab overlay:
#   dsh web --patch apps/cli/config/examples/colab.overlay.yml \
#     --public-url https://<tunnel>.trycloudflare.com \
#     --trusted-host <tunnel>.trycloudflare.com \
#     --no-open
#
# Architecture & security defaults:
# - Loopback-only Nexus gateway (http://127.0.0.1:7861/v1) with Host-only NEXUS_API_KEY
# - Trust X-Forwarded-Proto: https only from loopback proxy peers (cloudflared)
# - Constrain directory picker to approved persistent Drive + Colab workspace roots
# - Native Nexus Host plugin (independent image generation + progress/runtime proxies)
# - Native Plugin Marketplace (Installed + Discover tabs) backed by Nexus curated index
# - Zero MCP integrations

- id: authentication-token
  config:
    trustForwardedProto: true

- id: directory-picker
  config:
    allowedRoots:
      - !!js process.env.NEXUS_WORKSPACE_ROOT || '/content/drive/MyDrive/Nexus/workspaces/projects'
      - !!js process.env.NEXUS_SHARED_WORKSPACE_ROOT || '/content/drive/MyDrive/Nexus/workspaces/shared'
      - !!js process.env.NEXUS_OUTPUTS_ROOT || '/content/drive/MyDrive/Nexus/outputs'

- id: llm-pi-ai
  config:
    providers:
      nexus:
        displayName: Nexus Local Gateway
        api: openai-completions
        baseURL: !!js process.env.NEXUS_GATEWAY_URL || 'http://127.0.0.1:7861/v1'
        apiKeyEnv: NEXUS_API_KEY
        defaultInput:
          - text
          - image
        defaultContextWindow: 32768
        defaultMaxTokens: 4096
        models: !!js JSON.parse(process.env.NEXUS_DISCOVERED_MODELS || '[]')
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens

- insert:
    - id: nexus-host
      name: '@deepseek-ai/dsh-nexus-host'
      config:
        gatewayUrl: !!js process.env.NEXUS_GATEWAY_ROOT_URL || 'http://127.0.0.1:7861'
        apiKeyEnv: NEXUS_API_KEY
        imageTimeoutMs: 900000
        progressTimeoutMs: 5000
    - id: plugin-market
      name: '@deepseek-ai/dsh-plugin-market'
      disabled: !!js "!ctx.get('profileContext')"
      config:
        indexes:
          - !!js process.env.NEXUS_PLUGIN_INDEX_URL || 'http://127.0.0.1:7861/v1/plugin-index.json'
    - id: ui-plugin-market
      name: '@deepseek-ai/dsh-client-ui-plugin-market'
